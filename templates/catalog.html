<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Catalog · CO-OP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="landing">
    <div class="hero-shell">
      <nav class="primary-nav">
        <div class="brand">
          <span class="brand-icon">◎</span>
          <div>
            <strong>CO-OP</strong>
            <p>Powered by You</p>
          </div>
        </div>
        <div class="nav-actions">
          <a class="ghost-link" href="/">Home</a>
          <a class="ghost-link" href="/course" target="_blank">Workspace</a>
          <button class="ghost pill small" id="settings-toggle" type="button">Settings</button>
        </div>
      </nav>
    </div>

    <main class="flow-layout" style="padding-top: 2rem;">
      <section class="panel">
        <div class="panel-header">
          <p class="eyebrow">Catalog</p>
          <h2>Available courses</h2>
        </div>
        <div class="course-rect-grid">
          <article class="course-rect probability-rect">
            <div>
              <h3>Probability</h3>
              <button type="button" class="primary pill" id="open-probability-workspace">Go to the workspace</button>
              <div class="course-progress-mini">
                <div class="progress-track-mini">
                  <div class="progress-fill-mini prob-progress-fill"></div>
                </div>
                <span class="progress-value-mini prob-progress-value">0%</span>
              </div>
            </div>
          </article>
          <article class="course-rect biology-rect">
            <div>
              <h3>Biology Foundations</h3>
              <button type="button" class="primary pill" id="open-biology-workspace">Go to the workspace</button>
              <div class="course-progress-mini">
                <div class="progress-track-mini">
                  <div class="progress-fill-mini bio-progress-fill"></div>
                </div>
                <span class="progress-value-mini bio-progress-value">0%</span>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div class="settings-drawer hidden" id="settings-drawer">
      <div class="settings-overlay" id="settings-overlay"></div>
      <aside class="settings-panel">
        <header class="settings-header">
          <h3>Settings</h3>
          <button class="ghost pill small" id="settings-close" type="button">Close</button>
        </header>
        <div class="settings-body">
          <label class="settings-row">
            <span>Sounds</span>
            <select id="settings-sounds">
              <option value="white">White noise</option>
              <option value="lofi">Lo-Fi music</option>
              <option value="silence">Silence</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Visuality</span>
            <select id="settings-visuality">
              <option value="podcast">Podcast</option>
              <option value="genz">Gen Z style</option>
              <option value="visual">Visual style</option>
              <option value="reader">Reader style</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Theme</span>
            <select id="settings-theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </div>
      </aside>
    </div>
    <script src="{{ url_for('static', filename='catalog.js') }}"></script>
  </body>
</html>
