<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Workspace · CO-OP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script type="module" src="{{ url_for('static', filename='model-viewer.min.js') }}"></script>
  </head>
  <body class="workspace-body">
    <div class="workspace-shell">
      <aside class="workspace-nav">
        <div class="nav-header">
          <p class="eyebrow">Course workspace</p>
          <h2 id="workspace-title">Loading mission…</h2>
          <p id="workspace-subtitle"> </p>
        </div>
        <div class="status-legend">
          <span><span class="status completed"></span> Completed</span>
          <span><span class="status progress"></span> In progress</span>
          <span><span class="status not-started"></span> Not started</span>
        </div>
        <nav class="nav-sections">
          <h3>Modules</h3>
          <ul id="module-nav" class="nav-list"></ul>
          <h3>Practice More</h3>
          <ul id="practice-nav" class="nav-list"></ul>
        </nav>
      </aside>
      <main class="workspace-main">
        <div class="workspace-top-actions">
          <a class="ghost pill back-button" href="/catalog">← Back to catalog</a>
          <button class="primary pill" id="notebook-toggle" type="button">Open notepad</button>
          <button class="ghost pill small" id="settings-toggle" type="button">Settings</button>
        </div>

        <div id="workspace-content" class="workspace-content">
          <article class="stage-screen" id="content-stage"></article>
        </div>
        <div class="notebook-panel hidden" id="notebook-panel">
          <header class="notebook-header">
            <h3>Workspace notepad</h3>
            <button class="ghost pill small" id="notebook-close" type="button">Close</button>
          </header>
          <div class="notebook-mode-toggle">
            <button type="button" class="tool-btn active" data-mode="text">Typed notes</button>
            <button type="button" class="tool-btn" data-mode="draw">Draw &amp; highlight</button>
          </div>
          <div class="notebook-body">
            <section class="notebook-text">
              <label for="notebook-textarea">Typed notes</label>
              <textarea id="notebook-textarea" placeholder="Type quick reminders or answers here..."></textarea>
            </section>
            <section class="notebook-canvas hidden">
              <div class="canvas-toolbar">
                <span>Draw &amp; highlight</span>
                <div class="tool-group">
                  <button type="button" class="tool-btn" data-tool="pen" data-color="#0f172a">Black</button>
                  <button type="button" class="tool-btn" data-tool="pen" data-color="#d92c2c">Red</button>
                  <button type="button" class="tool-btn" data-tool="pen" data-color="#1d4ed8">Blue</button>
                  <button type="button" class="tool-btn" data-tool="highlighter" data-color="#facc15">Highlighter</button>
                  <button type="button" class="tool-btn" data-tool="eraser">Eraser</button>
                  <button type="button" class="tool-btn" data-tool="clear">Clear</button>
                </div>
              </div>
              <canvas id="notebook-canvas" width="640" height="360"></canvas>
            </section>
          </div>
          <div class="notebook-resize" id="notebook-resize" aria-hidden="true"></div>
        </div>
      </main>
    </div>
        <div class="settings-drawer hidden" id="settings-drawer">
          <div class="settings-overlay" id="settings-overlay"></div>
          <aside class="settings-panel">
            <header class="settings-header">
              <h3>Settings</h3>
          <button class="ghost pill small" id="settings-close" type="button">Close</button>
        </header>
        <div class="settings-body">
          <label class="settings-row">
            <span>Sounds</span>
            <select id="settings-sounds">
              <option value="white">White noise</option>
              <option value="lofi">Lo-Fi music</option>
                <option value="silence">Silence</option>
              </select>
            </label>
            <label class="settings-row">
              <span>Visuality</span>
              <select id="settings-visuality">
                <option value="podcast">Podcast</option>
                <option value="genz">Gen Z style</option>
                <option value="visual">Visual style</option>
                <option value="reader">Reader style</option>
              </select>
            </label>
            <label class="settings-row">
              <span>Theme</span>
              <select id="settings-theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
          </label>
        </div>
      </aside>
    </div>
    <script src="{{ url_for('static', filename='course.js') }}"></script>
  </body>
</html>
